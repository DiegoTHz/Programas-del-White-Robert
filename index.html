<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            margin-top: 100px;
        }

        h1{
            margin-bottom: 40px;
        }

        .botonPrograma{
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: 0.3s;
        }

        .botonPrograma:hover{
            background-color: #0056b3;
        }

    </style>

</head>
<body>

    <h1>Menú de Programas</h1>

    <button class="botonPrograma" id="QuickSort">
        QuickSort
    </button>

    <button class="botonPrograma" id="Merge">
        Merge
    </button>

    <button class="botonPrograma" id="Insercion">
        Insercion
    </button>

    <button class="botonPrograma" id="lineal">
        lineal
    </button>

    <button class="botonPrograma" id="binaria">
        binaria
    </button>

    <button class="botonPrograma" id="cola">
        Cola Circular
    </button>

    <button class="botonPrograma" id="prefijo">
        Notación Polaca Prefija
    </button>

    <button class="botonPrograma" id="memoria">
        Memoria Dinámica
    </button>

    <button class="botonPrograma" id="colaDoble">
        Cola de Doble Entrada
    </button>

    <button class="botonPrograma" id="colaLigada">
        Cola Ligada Doble Entrada
    </button>

    <button class="botonPrograma" id="colaCircularLigada">
        Cola Circular Ligada
    </button>

    <button class="botonPrograma" id="colaDobleLigada">
        Cola Doblemente Ligada
    </button>

    <button class="botonPrograma" id="loteCircular">
        Lote Circular de Coches
    </button>

    <button class="botonPrograma" id="tiendaMultiliga">
        Tienda Multiliga
    </button>

    <button class="botonPrograma" id="matrizDispersa">
        Matriz Dispersa
    </button>

    <button class="botonPrograma" id="triangular">
        Matriz Triangular
    </button>

    <script src="menu.js"></script>

</body>
</html>
