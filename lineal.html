<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda Lineal</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .barraSuperior{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #cerrar{
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #fechaHora{
            font-size: 18px;
            font-weight: bold;
        }

        h1{
            text-align: center;
            margin-top: 30px;
        }

        .contenedor{
            text-align: center;
            margin-top: 30px;
        }

        input{
            padding: 10px;
            width: 250px;
            font-size: 16px;
            margin: 5px;
        }

        button{
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        table{
            width: 70%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td{
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th{
            background-color: #673ab7;
            color: white;
        }

        .encontrado{
            background-color: lightgreen;
            font-weight: bold;
        }

        #resultado{
            text-align: center;
            font-size: 20px;
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>
<body>

    <div class="barraSuperior">

        <div id="fechaHora"></div>

        <button id="cerrar">
            Adiós
        </button>

    </div>

    <h1>Búsqueda Lineal de Nombres</h1>

    <div class="contenedor">

        <input
            type="text"
            id="nombre"
            placeholder="Escribe un nombre"
        >

        <button id="agregar">
            Agregar
        </button>

        <br><br>

        <input
            type="text"
            id="buscar"
            placeholder="Nombre a buscar"
        >

        <button id="buscarBtn">
            Buscar
        </button>

    </div>

    <table>

        <thead>

            <tr>
                <th>No.</th>
                <th>Nombre</th>
            </tr>

        </thead>

        <tbody id="tablaNombres">

        </tbody>

    </table>

    <div id="resultado"></div>

    <script src="lineal.js"></script>

</body>
</html>
