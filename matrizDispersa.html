<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Matriz Dispersa</title>

	<style>

		body{
			font-family: Arial, sans-serif;
			background-color: #f5f5f5;
			padding: 20px;
		}

		.barraSuperior{
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		#cerrar{
			background-color: red;
			color: white;
			border: none;
			padding: 10px 20px;
			border-radius: 10px;
			cursor: pointer;
			font-size: 16px;
		}

		#fechaHora{
			font-size: 16px;
			font-weight: bold;
		}

		h1{
			text-align: center;
			margin-top: 20px;
		}

		.contenedor{
			text-align: center;
			margin-top: 20px;
		}

		input[type="number"], input[type="text"]{
			padding: 8px;
			width: 140px;
			font-size: 14px;
			margin: 5px;
		}

		button{
			padding: 8px 14px;
			margin: 6px;
			font-size: 14px;
			cursor: pointer;
		}

		table{
			width: 90%;
			margin: 20px auto;
			border-collapse: collapse;
			background-color: white;
		}

		th, td{
			border: 1px solid black;
			padding: 8px;
			text-align: center;
		}

		th{
			background-color: #1976d2;
			color: white;
		}

		#mensaje{
			text-align: center;
			margin-top: 10px;
			font-weight: bold;
		}

	</style>

</head>
<body>

	<div class="barraSuperior">

		<div id="fechaHora"></div>

		<button id="cerrar">Cerrar</button>

	</div>

	<h1>Matriz Dispersa</h1>

	<div class="contenedor">

		<div>
			<input type="number" id="filas" placeholder="Filas" min="1">
			<input type="number" id="columnas" placeholder="Columnas" min="1">
			<button id="crearMatriz">Definir tamaño</button>
		</div>

		<hr style="width:90%; margin: 12px auto;">

		<div>
			<input type="number" id="filaEntrada" placeholder="Fila (0-index)" min="0">
			<input type="number" id="colEntrada" placeholder="Columna (0-index)" min="0">
			<input type="number" id="valorEntrada" placeholder="Valor" >
			<button id="agregarEntrada">Agregar Entrada</button>
		</div>

		<div style="margin-top:8px;">
			<button id="mostrarDispersa">Mostrar Matriz Dispersa</button>
			<button id="mostrarCompleta">Mostrar Matriz Completa</button>
			<button id="limpiar">Limpiar</button>
		</div>

	</div>

	<div id="mensaje"></div>

	<table id="tablaDispersa" style="display:none;">
		<thead>
			<tr>
				<th>Índice</th>
				<th>Fila</th>
				<th>Columna</th>
				<th>Valor</th>
			</tr>
		</thead>
		<tbody></tbody>
	</table>

	<table id="tablaCompleta" style="display:none;">
		<thead id="theadCompleta"></thead>
		<tbody id="tbodyCompleta"></tbody>
	</table>

	<script src="matrizDispersa.js"></script>

</body>
</html>
