<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cola Circular</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .barraSuperior{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #cerrar{
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #cerrar:hover{
            background-color: darkred;
        }

        #fechaHora{
            font-size: 18px;
            font-weight: bold;
        }

        h1{
            text-align: center;
            margin-top: 30px;
        }

        .contenedor{
            text-align: center;
            margin-top: 30px;
        }

        input{
            padding: 10px;
            width: 250px;
            font-size: 16px;
            margin: 5px;
        }

        button{
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: 0.3s;
        }

        button:hover{
            background-color: #0056b3;
        }

        #btnEliminar{
            background-color: #ff9800;
        }

        #btnEliminar:hover{
            background-color: #e68900;
        }

        table{
            width: 70%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td{
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th{
            background-color: #673ab7;
            color: white;
        }

        .frente{
            background-color: #c8e6c9;
            font-weight: bold;
        }

        .final{
            background-color: #ffecb3;
            font-weight: bold;
        }

        #mensaje{
            text-align: center;
            font-size: 18px;
            margin-top: 20px;
            font-weight: bold;
        }

        .info{
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
        }

    </style>

</head>
<body>

    <div class="barraSuperior">

        <div id="fechaHora"></div>

        <button id="cerrar">
            Adiós
        </button>

    </div>

    <h1>Cola Circular</h1>

    <div class="contenedor">

        <input
            type="text"
            id="dato"
            placeholder="Ingresa un dato (número o texto)"
        >

        <button id="agregar">
            Agregar
        </button>

        <button id="btnEliminar">
            Eliminar
        </button>

    </div>

    <div class="info">
        <p>Tamaño máximo: 10 elementos | Elementos actuales: <span id="contador">0</span></p>
    </div>

    <table>

        <thead>

            <tr>
                <th>Índice</th>
                <th>Posición</th>
                <th>Valor</th>
            </tr>

        </thead>

        <tbody id="tablaCola">

        </tbody>

    </table>

    <div id="mensaje"></div>

    <script src="cola.js"></script>

</body>
</html>
